name: Build unsigned iOS .ipa

# Unity 가 만들어 둔 Xcode 프로젝트(iOSBuild.zip)를 macOS 러너에서 컴파일만 한다.
#
#  - Unity 를 CI 에서 돌리지 않으므로 Unity 라이선스가 필요 없다.
#  - 서명하지 않는다. 서명은 나중에 윈도우에서 Sideloadly 가 무료 Apple ID 로 한다.
#  - 큰 파일은 저장소가 아니라 Release 첨부파일로 받는다 (Git LFS 할당량을 쓰지 않음).
#
# 준비
#   1) 이 저장소에 Release 를 하나 만들고 iOSBuild.zip 을 첨부한다.
#   2) Actions 탭 -> 이 워크플로 -> Run workflow -> 그 Release 의 태그를 입력한다.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "iOSBuild.zip 이 첨부된 Release 태그"
        required: true
        default: "xcode-latest"
      asset_name:
        description: "첨부파일 이름"
        required: true
        default: "iOSBuild.zip"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: Xcode 프로젝트 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ github.event.inputs.asset_name }}" \
            --dir .
          ls -lh "${{ github.event.inputs.asset_name }}"

      - name: 압축 풀기
        run: |
          mkdir -p xcode
          unzip -q "${{ github.event.inputs.asset_name }}" -d xcode
          cd xcode
          ls -la
          test -d Unity-iPhone.xcodeproj || { echo "Unity-iPhone.xcodeproj 가 없습니다"; exit 1; }

      - name: 빌드 (서명 없음)
        working-directory: xcode
        run: |
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: .ipa 로 포장
        working-directory: xcode
        run: |
          APP=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo ".app 을 찾지 못했습니다"; exit 1; }
          echo "앱: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CardboardHapticSearch-unsigned.ipa Payload
          ls -lh CardboardHapticSearch-unsigned.ipa

      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: CardboardHapticSearch-ipa
          path: xcode/CardboardHapticSearch-unsigned.ipa
          retention-days: 30

      - name: 실패하면 로그 일부
        if: failure()
        working-directory: xcode
        run: |
          echo "=== 최근 오류 ==="
          find ./DerivedData -name "*.log" 2>/dev/null | head -3
